[project]
name = "soc-platform"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    "pywin32>=306; sys_platform == 'win32'",
    "wmi>=1.5.1; sys_platform == 'win32'"
]

[tool.vercel]
entrypoint = "dashboard.api:app"
